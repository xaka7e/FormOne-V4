name: Packaging repair verification
on:
  push:
    branches: [fix/catalog-packaging-20261002]
    paths:
      - .github/workflows/packaging-repair.yml
      - scripts/repair-packaging.py
      - tests/test_packaging_integrity.py
permissions:
  contents: write
concurrency:
  group: packaging-repair-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare scene environment and verified original photos
        run: |
          python -m pip install pillow cairosvg
          mkdir -p diagnostics qa
          git show 39a42966884bffe1a4d1cec0ea7295326d6a3fb6:scripts/build-flavor-scenes.py > diagnostics/previous-builder.py
          python - <<'PY'
          from pathlib import Path
          import importlib.util,json
          p=Path('diagnostics/previous-builder.py').read_text()
          Path('scripts/catalog-environment.py').write_text(p.split('\ndef download(url):')[0]+'\n')
          spec=importlib.util.spec_from_file_location('repair','scripts/repair-packaging.py');mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          for entry in json.loads(Path('assets/catalog-scenes/sources.json').read_text()): mod.original(entry)
          PY
          sha256sum assets/scene-*.png assets/formone-*.jpg styles.css > /tmp/hero-before.sha256
      - name: Reproduce label erasure with real photos
        run: |
          set +e
          PYTHONPATH=tests PACKAGING_BUILDER=diagnostics/previous-builder.py python -m unittest test_packaging_integrity.PackagingIntegrity.test_all_real_product_interiors_remain_opaque test_packaging_integrity.PackagingIntegrity.test_a_new_unreviewed_photo_is_not_processed_silently > qa/red-regression.txt 2>&1
          code=$?
          set -e
          cat qa/red-regression.txt
          test "$code" -ne 0
          grep -q 'transparent holes' qa/red-regression.txt
          grep -q 'white label touching' qa/red-regression.txt
      - name: Rebuild complete packaging and validate source pixels
        run: |
          python scripts/repair-packaging.py
          python -m unittest discover -s tests -p test_packaging_integrity.py -v
          node --check animation.js
          sha256sum -c /tmp/hero-before.sha256
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium webkit
          nohup python -m http.server 4173 > /tmp/formone-http.log 2>&1 &
      - name: Browser regressions and actual mobile screenshots
        run: |
          node tests/mobile-story.cjs
          node tests/catalog-scenes.cjs
          BROWSER=webkit node tests/catalog-scenes.cjs
          node - <<'JS'
          const {webkit}=require('playwright');
          (async()=>{
            const browser=await webkit.launch();
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            for(const [flavor,name] of [['cookies','cookies'],['clear-peach','foil'],['magnesium','gummies']]){
              const image=page.locator(`.cards .card-visual[data-flavor="${flavor}"] img`);
              await image.scrollIntoViewIfNeeded();await image.evaluate(img=>img.decode());
              const card=page.locator('.cards .card').filter({has:image});
              await card.screenshot({path:`qa/packaging-mobile-${name}.png`});
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Save only verified changes to repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add animation.js index.html assets/catalog-scenes scripts/catalog-environment.py qa/packaging-v3-review.jpg qa/packaging-mobile-*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Restore opaque labels and silver packaging in all 13 catalog scenes'
            git push origin HEAD:fix/catalog-packaging-20261002
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaging-repair-review
          path: qa/
          retention-days: 3
